<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f7f8fc;
    color:#222;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 20px;
}

.container{
    max-width:1200px;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.book-cover{
    display:flex;
    justify-content:center;
}

.cover{
    width:320px;
    height:450px;
    border-radius:20px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    padding:30px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.cover h2{
    font-size:36px;
}

.cover p{
    opacity:.9;
}

.content h1{
    font-size:52px;
    margin-bottom:15px;
}

.subtitle{
    font-size:20px;
    color:#666;
    margin-bottom:25px;
}

.price{
    font-size:40px;
    font-weight:bold;
    color:#4f46e5;
    margin-bottom:25px;
}

.features{
    list-style:none;
    margin-bottom:30px;
}

.features li{
    margin-bottom:12px;
    font-size:18px;
}

.btn{
    display:inline-block;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    padding:16px 35px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#4338ca;
}

.section{
    max-width:1100px;
    margin:auto;
    padding:80px 20px;
}

.section h2{
    text-align:center;
    margin-bottom:20px;
    font-size:38px;
}

.description{
    max-width:800px;
    margin:auto;
    text-align:center;
    line-height:1.8;
    color:#555;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
        text-align:center;
    }

    .content h1{
        font-size:40px;
    }

    .cover{
        width:280px;
        height:400px;
    }
}
</style>
</head>
<body>

<script>
// Book data stored in JSON
const bookData = {
    title: "The 1% Growth Formula",
    author: "Daniel Hart",
    price: "$19.99",
    subtitle: "Small Daily Habits That Create Extraordinary Success",
    description:
        "Discover the proven framework used by top performers to improve every day, build unstoppable momentum, and achieve long-term success. Learn practical systems for productivity, discipline, and personal growth.",
    features: [
        "✓ Practical step-by-step framework",
        "✓ Productivity & focus strategies",
        "✓ Habit building techniques",
        "✓ Real-world case studies",
        "✓ Bonus action worksheets"
    ],
    buyLink: "#"
};

document.body.innerHTML = `
<section class="hero">
    <div class="container">

        <div class="book-cover">
            <div class="cover">
                <div>
                    <p>BESTSELLER</p>
                    <h2>${bookData.title}</h2>
                </div>

                <div>
                    <p>by ${bookData.author}</p>
                </div>
            </div>
        </div>

        <div class="content">
            <h1>${bookData.title}</h1>
            <p class="subtitle">${bookData.subtitle}</p>

            <div class="price">${bookData.price}</div>

            <ul class="features">
                ${bookData.features.map(item => `<li>${item}</li>`).join("")}
            </ul>

            <a href="${bookData.buyLink}" class="btn">
                Buy Now
            </a>
        </div>

    </div>
</section>

<section class="section">
    <h2>About The Book</h2>
    <p class="description">
        ${bookData.description}
    </p>
</section>
`;
</script>

</body>
</html>
