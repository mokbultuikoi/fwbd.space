<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Verified</title>
  <style> 
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e7edf7;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 50% 55%, rgba(35, 62, 86, .42), transparent 52%),
        linear-gradient(145deg, #0b0d17 0%, #111b2a 52%, #1a2938 100%);
    }
    .verification-card {
      width: min(100%, 590px);
      padding: clamp(32px, 7vw, 68px) clamp(22px, 6vw, 58px) 60px;
      text-align: center;
      border: 1px solid rgba(0, 210, 238, .22);
      border-radius: 38px;
      background: rgba(34, 42, 56, .78);
      box-shadow: 0 0 34px rgba(0, 204, 235, .07), inset 0 0 28px rgba(255,255,255,.015);
    }
    h1 {
      margin: 0 0 32px;
      color: #08d7f4;
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.12;
      font-weight: 750;
      letter-spacing: -.8px;
      text-shadow: 0 0 18px rgba(0, 210, 245, .18);
      white-space: nowrap;
    }
    .check { margin-left: 4px; }
    p {
      margin: 0 auto 54px;
      max-width: 470px;
      color: #d7dce6;
      font-size: clamp(17px, 3.6vw, 25px);
      line-height: 1.58;
    }
    .signup-button {
      display: block;
      width: 100%;
      min-height: 92px;
      border: 0;
      border-radius: 20px;
      color: white;
      background: linear-gradient(110deg, #08c8e9 0%, #3987df 100%);
      box-shadow: 0 12px 34px rgba(0, 196, 235, .22);
      font-size: clamp(20px, 4.5vw, 30px);
      font-weight: 750;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    .signup-button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .signup-button:active { transform: translateY(0); }
    .policy {
      display: inline-block;
      margin-top: 50px;
      color: #8d98aa;
      font-size: 19px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 400px) {
      .verification-card { border-radius: 28px; padding-bottom: 42px; }
      h1 { white-space: normal; }
      .signup-button { min-height: 74px; border-radius: 16px; }
      p { margin-bottom: 36px; }
      .policy { margin-top: 36px; }
    }
  </style>
</head>
<body>
  <main class="verification-card">
    <h1>First Verified <span class="check">✅</span></h1>
    <p>
      Your identity has been securely verified.<br />
      Click the button below to proceed to the registration page.
    </p>
    <button class="signup-button" type="button"
      onclick="window.location.href='https://fastwinbd.com'">
      SIGN UP NOW
    </button>
    <a class="policy" href="https://fastwinbd.com">Privacy &amp; Terms Policy</a>
  </main>
</body>
</html>
